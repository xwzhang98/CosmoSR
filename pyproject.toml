[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmosr"
version = "0.1.0"
description = "Cosmology-conditioned particle super-resolution training"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "torch>=2.8",
  "numpy>=1.24,<3",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "tensorboard>=2.14"
]

[project.scripts]
cosmosr-train = "cosmosr.cli:main"

[tool.setuptools.packages.find]
include = ["cosmosr*"]

[tool.setuptools.data-files]
"share/cosmosr/configs" = ["configs/state56.json"]
